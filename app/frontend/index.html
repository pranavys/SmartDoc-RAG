<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartDoc-RAG</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="chat-container">

        <header>
            <h1>SmartDoc-RAG</h1>
            <p>Ask questions about your documents</p>
        </header>

        <section class="upload-section">

            <input
                type="file"
                id="file-input"
                accept=".pdf,.docx"
            >

            <button id="upload-button">
                Upload Document
            </button>

            <p id="upload-status"></p>

        </section>

        <main id="chat-box">

            <div class="message assistant">
                Hello! Upload a document and ask me a question.
            </div>

        </main>

        <form id="chat-form">

            <input
                type="text"
                id="message-input"
                placeholder="Ask a question..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
